buy = ""
cost = "Free"
time = "10 min"
tools = []
steps = [
  "Put the heaviest things in the bottom drawers or on the lowest shelves",
  "Keep the top drawers and shelves light",
]
avoid = ""
renter = ""
when = "contents"
source = "CPSC Anchor It; Tokyo Fire Department"

[within_reach]
label = "Everyday things within reach"
icon = "hand"
why = "Reaching up or leaning on it for balance is how adults pull it over."
buy = ""
cost = "Free"
time = "10 min"
tools = []
steps = [
  "Keep things used every day between waist and shoulder height",
  "Nothing used often on top of the TV or the furniture",
]
avoid = "Reaching up or leaning on an open drawer is how older adults pull furniture over."
