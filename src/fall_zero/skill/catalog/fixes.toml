[locks]
label = "Drawer latches"
icon = "lock"
why = "Only one drawer opens at a time, whether a child pulls them or the floor shakes."
buy = "Child-safety drawer latches, one per drawer"
tools = ["Screwdriver"]
steps = [
  "Fit a latch inside the top of each drawer",
  "Check a drawer opens only when you press the latch",
]
avoid = "Latches slow a child down; they don't stop a determined climber. Strap it too."
renter = "Adhesive latches leave nothing behind and work the same."
when = "drawers"
source = "CPSC Anchor It; ASTM F2057-23 interlock tests"
item = "Child-safety drawer latches, a set"
count = 1
cost_usd = [10, 20]
minutes = 20

[locks.check]
ask = "Tug each drawer without pressing its latch: none should open"
holds = "None of them open"
moved = "A drawer opened"

[[locks.stuck]]
key = "wont_fit_inside"
label = "The latch won't fit inside"
say = "No lip or frame inside for it to catch on? Use an outside strap latch instead: it sticks across the drawer front and the frame beside it, and opens with a slide button. Clean and dry both spots first."
then = ""
source = "Evenflo cabinet and drawer latch instructions (multi-purpose strap latch): https://www.evenflo.com/cdn/shop/files/us_cabinet-drawer-latches_EN.pdf"

[[locks.stuck]]
key = "falls_off"
label = "The sticky latch falls off"
say = "Clean and dry both spots, press hard, and let it set before first use (Evenflo says 48 hours). Still falls off? Use latches that screw into the drawer, as Evenflo's own instructions require."
then = ""
source = "Evenflo cabinet and drawer latch instructions: https://www.evenflo.com/cdn/shop/files/us_cabinet-drawer-latches_EN.pdf"

[[locks.stuck]]
key = "child_opens"
label = "My child opens the latches"
say = "Latches only slow a child down, and makers say to stop using them once a child can defeat them. Strap the piece to the wall, so an open drawer can't pull it over."
then = "strap"
source = "Evenflo cabinet and drawer latch instructions (stop when the child can defeat them): https://www.evenflo.com/cdn/shop/files/us_cabinet-drawer-latches_EN.pdf; CPSC Anchor It, how to install a kit: https://www.anchorit.gov/how-to-anchor/how-to-install-a-kit/"

[[locks.stuck]]
key = "not_mine"
label = "It's not my furniture"
say = "Use stick-on latches: they leave no holes. Test one on a hidden spot first, since the adhesive can lift some finishes. Ask the owner about strapping the piece too: latches don't hold it up."
then = "landlord"
source = "Evenflo cabinet and drawer latch instructions (adhesive may remove some finishes): https://www.evenflo.com/cdn/shop/files/us_cabinet-drawer-latches_EN.pdf"

