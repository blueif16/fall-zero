then = ""
source = "Peerless-AV metal-stud wall plate instructions: https://peerless-av.com/_product-assets/en-us/1010452639/Assembly-Instructions.pdf; CPSC Anchor It, what you'll need: https://www.anchorit.gov/how-to-anchor/what-youll-need/"

[[tv_strap.stuck]]
