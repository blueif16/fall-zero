steps = [
  "Fit a latch inside each door that opens on its own when the cabinet is shaken",
  "Keep heavy dishes and glass on the lowest shelves",
]
avoid = "In shaking, doors swing open and what's behind them falls out."
renter = "Adhesive latches leave nothing behind."
