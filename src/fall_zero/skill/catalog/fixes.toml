# What to do about a risk, in practice: what to buy, what it costs, how long it takes and the steps, for the
# page's fix cards. Keys are the fix kinds the engine and the describe step name; the code reads them, it
# never writes this advice itself. `renter`: what to do without drilling, and how far to trust it.
# `when`: who it is for, for the code that picks fixes. `source`: where the advice comes from.
# `why`: the card's one line on why it helps. `icon`: what the page draws (strap, lock, top, distance, tv,
# toy, weight, hand, latch, search). `anchors = true`: a way to hold the piece itself down, which the
# describe step picks for each piece.
# For the plan's shopping list (docs/FLOW.md S3), per piece: `item` (the list's label, "" when nothing is
# bought), `count` (how many of `item`; 1 for a set or kit, 0 when nothing is bought), `cost_usd = [lo, hi]`
# and `minutes`. `check`: the ten-second test after the fix (`ask`, and the `holds` and `moved` buttons).
# `stuck`: the "I'm stuck" options of the kinds that install something (docs/FLOW.md S4): `label` is the
# chip, `say` what to do instead, `then` a fix kind here, "landlord" or "handyman" (catalog/handoffs.toml),
# or "" for none.
#
# Research behind it (2026-10): CPSC 2023 tip-over report (Feb 2024): 17,800 ED-treated injuries a year,
# 71% of deaths children (55% aged 1-3, most of the known cases climbing), 26% adults 60+, 44% of deaths
# in bedrooms, half crushed under the piece, two thirds head injuries, 47% involve a TV. Consumer Reports
# anchor-kit tests (2024): metal or nylon straps into a wood stud held 230-350 lb per anchor, a plastic
# strap pulled out at 23 lb, peel-and-stick kits did worst; anchor every piece in two places. Consumer
# Reports surveys (2018, 2021): two thirds don't anchor; "it seems stable enough" (41-45%) and "no holes in
# the wall" (25-29%) are the reasons. Tokyo Fire Department: furniture causes 30-50% of earthquake
# injuries; L-brackets into the wall, or tension poles with stopper mats where you can't drill.

[strap]
label = "Anti-tip straps into a wall stud"
anchors = true
icon = "strap"
why = "A strap into a stud holds it when a child climbs it or the floor shakes."
buy = "2 metal or nylon anti-tip straps"
tools = ["Drill", "Stud finder"]
steps = [
  "Find a stud behind the top of the piece",
  "Screw one bracket into the stud and one into the back of the top",
  "Join them and pull the strap snug; do the same on the other side",
]
avoid = "Plastic straps and peel-and-stick kits held the least in Consumer Reports' tests. A screw into bare drywall pulls out."
renter = "Two small screw holes are easy to fill when you move out; ask your landlord. Can't drill at all? A tension pole between the top and the ceiling with stopper mats under the front is the Tokyo Fire Department's no-drill option."
when = "furniture"
source = "Consumer Reports anchor-kit tests 2024; CPSC Anchor It; Tokyo Fire Department"
item = "Anti-tip straps, metal or nylon"
count = 2
cost_usd = [10, 25]
minutes = 15

[strap.check]
ask = "Pull the top of the piece gently toward you"
holds = "It doesn't move"
moved = "It moved or a strap slipped"

[[strap.stuck]]
key = "metal_studs"
label = "My wall has metal studs"
say = "A wood screw strips in steel. Buy toggle anchors made for metal studs, drill the hole size on the pack through the drywall into the stud's center, set the toggle and bolt the wall bracket to it."
then = ""
source = "Peerless-AV metal-stud wall plate instructions: https://peerless-av.com/_product-assets/en-us/1010452639/Assembly-Instructions.pdf; IKEA anchoring guide: https://www.ikea.com/us/en/files/pdf/d4/4a/d44a59ef/just_a_moment_guide_2025.pdf"

[[strap.stuck]]
key = "plaster"
label = "My walls are old plaster"
say = "Plaster sits on wood studs. Find one with a strong magnet (it finds the nails), drill slowly through the plaster so it doesn't crack, and drive a longer wood screw into the stud. A screw in plaster alone won't hold."
then = ""
source = "IKEA anchoring guide (magnet for lath and plaster): https://www.ikea.com/us/en/files/pdf/d4/4a/d44a59ef/just_a_moment_guide_2025.pdf; CPSC Anchor It, how to install a kit: https://www.anchorit.gov/how-to-anchor/how-to-install-a-kit/; Tokyo Fire Department handbook (long wood screws into the studs): https://www.tfd.metro.tokyo.lg.jp/content/000010472.pdf"

[[strap.stuck]]
key = "brick_concrete"
label = "My wall is brick or concrete"
say = "No stud needed. Drill into the brick itself, not the mortar, with a masonry bit (a hammer drill helps; stores rent them), then fix the wall bracket with concrete screws. Or have a handyman do it."
then = "handyman"
source = "CPSC Anchor It, how to install a kit: https://www.anchorit.gov/how-to-anchor/how-to-install-a-kit/; CPSC Anchor It, what you'll need: https://www.anchorit.gov/how-to-anchor/what-youll-need/"

[[strap.stuck]]
key = "no_stud"
label = "There's no stud where it stands"
say = "Slide the piece so both straps reach studs; they're 16 or 24 inches apart. Or screw a 1x4 board across the two nearest studs behind it and strap into the board. Never into bare drywall."
then = ""
source = "CPSC Anchor It, how to install a kit (move the piece to a stud): https://www.anchorit.gov/how-to-anchor/how-to-install-a-kit/; InspectandTest, toggle bolts (a ledger across two studs): https://inspectandtest.net/guides/toggle-bolts/"

[[strap.stuck]]
key = "thin_back"
label = "The back is thin or has no holes"
say = "Skip the thin back sheet: it's only stapled or slotted in. Screw the furniture bracket into the top panel, a side panel or a solid top rail, from behind, with the kit's short screws so they don't come through."
then = ""
source = "RH anti-tip kit instructions (solid wood, not the back panel): https://images.rhbabyandchild.com/bc/content/catalog/product/pdfs/rhbc_prod732276_info.pdf; CPSC Anchor It, how to install a kit (not a stapled-on back): https://www.anchorit.gov/how-to-anchor/how-to-install-a-kit/"

[[strap.stuck]]
key = "not_against_wall"
label = "It isn't against a wall"
say = "Turn it so its back or one end meets a wall, and strap there. A room divider: screw L-brackets from its 4 bottom corners into the floor (masonry screws in concrete), or bolt two units back to back."
then = ""
source = "Central US Earthquake Consortium, securing a free-standing shelving unit: http://www.cusec.org/documents/media/K_FSShelvingUnit.pdf; CPSC Anchor It, how to install a kit: https://www.anchorit.gov/how-to-anchor/how-to-install-a-kit/"

[[strap.stuck]]
key = "wires_behind"
label = "There might be wires or pipes"
say = "Before drilling, scan with a wall scanner that detects live wires and pipes, above all near outlets, switches, kitchens and bathrooms. If you can't be sure, don't drill there: use another stud or ask a handyman."
then = "handyman"
source = "IKEA anchoring guide (check for wires and pipes): https://www.ikea.com/us/en/files/pdf/d4/4a/d44a59ef/just_a_moment_guide_2025.pdf"

[[strap.stuck]]
key = "renting"
label = "I rent"
say = "Ask your landlord: two small screw holes per piece, for a child's safety, filled when you move out. The message is ready to send. If they say no, use the no-drill option: two tension poles to the ceiling and a stopper strip."
then = "landlord"
source = "NSW Government, toppling furniture and TVs (ask, explain, offer to repair, get it in writing): https://www.nsw.gov.au/legal-and-justice/consumer-rights-and-protection/safety/other-consumer-products/toppling-furniture-and-televisions; Tokyo Fire Department handbook: https://www.tfd.metro.tokyo.lg.jp/content/000010472.pdf"

[[strap.stuck]]
key = "no_drill"
label = "Can't drill: asbestos, not allowed"
say = "Never drill a wall that may hold asbestos. Fit two tension poles from the top's back corners to a strong ceiling (or a board across it), and a stopper strip under the whole front edge. Not for shallow pieces."
then = "distance"
source = "Tokyo Fire Department handbook (poles at the back of both sides, a stopper strip end to end, a board on a weak ceiling): https://www.tfd.metro.tokyo.lg.jp/content/000010472.pdf; Shinjuku City: https://www.city.shinjuku.lg.jp/anzen/kikikanri01_english07.html; US EPA, asbestos in the home (leave it undisturbed): https://www.epa.gov/asbestos/protect-your-family-exposures-asbestos"

[[strap.stuck]]
key = "partner_says_no"
label = "Someone at home says no"
say = "Show them the fall here: it takes seconds, even with someone watching. The strap hides behind the piece and two small holes fill with spackle. Still no? Use tension poles and a stopper strip, and keep beds clear."
then = ""
source = "CPSC \"Even when you're watching\" PSA: https://www.cpsc.gov/Newsroom/Video/Anchor-It-Even-When-Youre-Watching-Public-Service-Announcement; Tokyo Fire Department handbook: https://www.tfd.metro.tokyo.lg.jp/content/000010472.pdf"

[[strap.stuck]]
key = "wont_stay"
label = "It still moves after strapping"
say = "A screw that pulls out missed the stud: refit it in the stud's center, feeling resistance all the way in. A slack strap: pull it tight. A plastic strap: replace it with metal or nylon. Re-check after moving the piece."
then = ""
source = "CPSC Anchor It, how to install a kit: https://www.anchorit.gov/how-to-anchor/how-to-install-a-kit/; Consumer Reports anchor-kit tests (plastic straps held least): https://nbcdfw.com/news/consumer-reports/furniture-anchors-prevent-deaths-and-injuries-consumer-reports-put-kits-to-the-test/3702524/"

[[strap.stuck]]
key = "someone_else"
label = "I'd rather someone else did it"
say = "Send a handyman the work order: the pieces, two straps each, screwed into studs, not bare drywall. Ask for every piece in one visit. Work done by someone else gets finished more often."
then = "handyman"
source = "Currin 2011, tasks given to outside providers got done more often: https://doi.org/10.1111/j.1741-6612.2011.00545.x; CPSC Anchor It, how to install a kit: https://www.anchorit.gov/how-to-anchor/how-to-install-a-kit/"

[bracket]
label = "The range's anti-tip bracket"
anchors = true
icon = "strap"
why = "The bracket holds the back down when someone stands on the open oven door."
buy = "The anti-tip bracket for this range (most come with one; makers send replacements)"
tools = ["Drill"]
steps = [
  "Slide the range out",
  "Screw the bracket to the floor or wall where the back foot stands",
  "Slide the range back until its foot locks under the bracket",
  "Check: the back should not lift when you pull the top gently",
]
avoid = "A bracket left off after the range was moved or cleaned behind does nothing."
renter = "The landlord owns the range: ask them to fit the bracket. It is a safety requirement of the range itself."
when = "appliance"
source = "UL 858 / ANSI Z21.1 range stability requirements; CPSC range tip-over warnings"
item = "Anti-tip bracket made for this range"
count = 1
cost_usd = [0, 20]
minutes = 20

[bracket.check]
ask = "Pull the top of the range gently toward you: the back should not lift"
holds = "The back stays down"
moved = "The back lifted"

[[bracket.stuck]]
key = "no_bracket"
label = "There's no bracket"
say = "Call the range's maker with the model number and ask for its anti-tip bracket: GE and Midea, for example, send one free. Use the one made for this model, since where it goes depends on the range."
then = ""
source = "GE Appliances anti-tip bracket instructions: https://www.geappliances.com/content/migrated-root-images/infobase/31-10671_anti_tip_install.pdf; Midea range installation instructions: https://www.midea.com/content/dam/midea-aem/us/ranges/mes30s2ast/MES30-Installation-Instructions-Electric.pdf; Amana range installation instructions: https://www.amana.com/content/dam/global/documents/202204/installation-instructions-w11603122-revA.pdf"

[[bracket.stuck]]
key = "tile_concrete"
label = "The floor is tile or concrete"
say = "Drill with a masonry bit and fix it as your range's manual says for concrete (GE: a 5/32-inch hole 2 inches deep, then the kit's screws; Midea: sleeve anchors you buy). Unsure about the tile? Ask a handyman."
then = "handyman"
source = "GE Appliances anti-tip bracket instructions: https://www.geappliances.com/content/migrated-root-images/infobase/31-10671_anti_tip_install.pdf; Midea range installation instructions: https://www.midea.com/content/dam/midea-aem/us/ranges/mes30s2ast/MES30-Installation-Instructions-Electric.pdf"

[[bracket.stuck]]
key = "metal_studs"
label = "The wall has metal studs"
say = "Don't fix it to that wall: GE's instructions say to screw the bracket to the floor when the wall has metal studs. Wood floor: the kit's screws. Concrete or tile: a masonry bit and anchors."
then = ""
source = "GE Appliances anti-tip bracket instructions: https://www.geappliances.com/content/migrated-root-images/infobase/31-10671_anti_tip_install.pdf"

[[bracket.stuck]]
key = "off_wall"
label = "The range doesn't reach the wall"
say = "Screw the bracket to the floor where the range's back will stand, lined up with its back and side, not against the wall. GE requires the floor mount whenever the bracket can't touch the wall."
then = ""
source = "GE Appliances anti-tip bracket instructions: https://www.geappliances.com/content/migrated-root-images/infobase/31-10671_anti_tip_install.pdf"

[[bracket.stuck]]
key = "still_lifts"
label = "The back still lifts"
say = "The foot isn't under the bracket. Slide the range out, check the bracket is screwed down, clear anything behind, and push it fully back: more than 2 inches from the wall and the foot can miss. Never remove the leveling legs."
then = ""
source = "Amana range installation instructions: https://www.amana.com/content/dam/global/documents/202204/installation-instructions-w11603122-revA.pdf; GE Appliances anti-tip bracket instructions: https://www.geappliances.com/content/migrated-root-images/infobase/31-10671_anti_tip_install.pdf"

[[bracket.stuck]]
key = "cant_move"
label = "I can't slide the range out"
say = "A range is heavy and may have a gas line behind it. Get a second person to help, or ask a handyman or appliance installer to fit the bracket. Don't bend or move a gas line yourself: that's for a qualified technician."
then = "handyman"
source = "Amana range installation instructions (gas changes by a qualified technician): https://www.amana.com/content/dam/global/documents/202204/installation-instructions-w11603122-revA.pdf"

[[bracket.stuck]]
key = "renting"
label = "I rent"
say = "The range belongs to the landlord, and the bracket is part of installing it safely. Ask them to fit it, or to order the bracket for this model so you can. The message is ready to send."
then = "landlord"
source = "GE Appliances anti-tip bracket instructions (the range must be secured by the bracket): https://www.geappliances.com/content/migrated-root-images/infobase/31-10671_anti_tip_install.pdf; NSW Government, toppling furniture and TVs: https://www.nsw.gov.au/legal-and-justice/consumer-rights-and-protection/safety/other-consumer-products/toppling-furniture-and-televisions"

[tv_strap]
label = "Strap the TV"
anchors = true
icon = "tv"
why = "A strapped TV can't topple forward onto a child."
buy = "A TV anti-tip strap kit (2 straps), or a wall mount"
tools = ["Screwdriver", "Drill"]
steps = [
  "Screw the straps into the threaded holes on the back of the TV",
  "Fix the other ends into a wall stud, or into the back of a heavy, anchored stand",
  "Push the TV back on a low, sturdy stand",
]
avoid = "A TV on a dresser or tall chest is the most common deadly combination: the child climbs the drawers to reach it."
renter = "Strap the TV to the back of its stand, and anchor the stand. A low, wide stand with the TV pushed back is the next best thing."
when = "tv"
source = "CPSC Anchor It; CPSC 2023 tip-over report (47% of deaths involve a TV)"
item = "TV anti-tip strap kit (2 straps)"
count = 1
cost_usd = [10, 20]
minutes = 15

[tv_strap.check]
ask = "Pull the top of the TV gently toward you: the straps should stop it"
holds = "The straps stop it"
moved = "It tipped or a strap gave"

[[tv_strap.stuck]]
key = "no_holes"
label = "My TV has no holes on the back"
say = "Most flat TVs have threaded mount holes on the back. An older, deeper TV with none needs a different kind of strap: take its model to a hardware store and ask for one that fits."
then = ""
source = "CPSC Anchor It, what you'll need (TVs): https://www.anchorit.gov/how-to-anchor/what-youll-need/"

[[tv_strap.stuck]]
key = "bolts_dont_fit"
label = "The bolts don't fit my TV"
say = "Thread each bolt in by hand to find the size: M4, M5, M6 or M8. Use the shortest one that grips well, since a bolt too long can damage the TV. A hardware store sells metric bolts if none in the kit fit."
then = ""
source = "Sanus A701 TV anti-tip strap instructions: https://accents.sanus.com/assets/products/a701/documents/A701_IM_6904_002050_Rev_00.pdf"

[[tv_strap.stuck]]
key = "on_dresser"
label = "The TV is on a dresser"
say = "Move it to a low stand made for a TV: a child climbs the drawers to reach it, the most common deadly combination. Then strap the TV to that stand. Keeping it on the dresser? Strap the dresser to the wall as well."
then = "moved"
source = "CPSC 2023 tip-over report: https://www.cpsc.gov/s3fs-public/2023_Annual_Tip_Over_Report_Posted_2024Feb_FINAL_0.pdf; CPSC Anchor It, what you'll need (furniture designed to hold a TV): https://www.anchorit.gov/how-to-anchor/what-youll-need/"

[[tv_strap.stuck]]
