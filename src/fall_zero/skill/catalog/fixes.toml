[[latches.stuck]]
key = "daily_use"
label = "Latches are a pain every day"
say = "Fit push latches (press the door to open) or a quake latch that only drops into place when the cabinet shakes. Until then, twist a hair tie around two side-by-side handles."
then = ""
source = "Earthquake Country Alliance, Secure Your Space (latch types): https://www.earthquakecountry.org/library/ECA_Step_1_SecureYourSpace_Document-EN.pdf; NHK, using tension poles and L-brackets (hair tie on handles): https://www.nhk.or.jp/shutoken/shutobo/sonae_eq_04.html"

[[latches.stuck]]
key = "cant_screw"
label = "I rent or can't screw in"
say = "Use child-proof latches that stick on: clean and dry both spots, press hard, and wait the full set time on the pack before opening (Evenflo says 48 hours). Test on a hidden spot first."
then = ""
source = "Earthquake Country Alliance, Secure Your Space (adhesive child-proof latches): https://www.earthquakecountry.org/library/ECA_Step_1_SecureYourSpace_Document-EN.pdf; Evenflo cabinet and drawer latch instructions: https://www.evenflo.com/cdn/shop/files/us_cabinet-drawer-latches_EN.pdf"

[[latches.stuck]]
key = "glass_doors"
label = "The doors are glass"
say = "Put shatter-resistant film on the glass so a broken pane holds together, and fix the latch to the wooden frame, or use a throwover latch that screws to the front of the doors."
then = ""
source = "Shinjuku City (shatter-resistant film): https://www.city.shinjuku.lg.jp/anzen/kikikanri01_english07.html; Earthquake Country Alliance, Secure Your Space (throwover latches): https://www.earthquakecountry.org/library/ECA_Step_1_SecureYourSpace_Document-EN.pdf"

[[latches.stuck]]
key = "things_slide"
label = "Things inside still slide around"
say = "Lay non-slip liner on each shelf, stick vases and small heavy pieces down with museum putty, and keep heavy dishes and glass on the lowest shelves."
then = "heavy_low"
source = "Earthquake Country Alliance, Secure Your Space (museum putty): https://www.earthquakecountry.org/library/ECA_Step_1_SecureYourSpace_Document-EN.pdf; NHK (non-slip sheets on dish shelves): https://www.nhk.or.jp/shutoken/shutobo/sonae_eq_04.html"

[[latches.stuck]]
key = "cabinet_rocks"
label = "The cabinet itself could tip"
say = "Latches keep the doors shut, not the cabinet up. Screw the cabinet to the wall with L-brackets or straps into studs: the Tokyo Fire Department rates screwing it to the wall the most effective fix."
then = "strap"
source = "Tokyo Fire Department handbook: https://www.tfd.metro.tokyo.lg.jp/content/000010472.pdf"

