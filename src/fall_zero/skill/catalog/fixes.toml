[distance]
label = "Clear where it would land"
icon = "distance"
why = "If it falls, nobody is under it."
buy = ""
cost = "Free"
time = "10 min"
tools = []
steps = [
  "Move the crib, bed or play mat out of the shaded area where it would land",
  "Keep doorways and hallways clear of tall furniture",
]
avoid = "44% of tip-over deaths happen in bedrooms."
renter = ""
