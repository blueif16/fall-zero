[latches]
label = "Cabinet latches for shaking"
icon = "latch"
why = "Shaking swings doors open and what's behind them falls out."
buy = "Earthquake latches for the doors"
cost = "$10–30"
time = "20 min"
tools = ["Screwdriver"]
steps = [
  "Fit a latch inside each door that opens on its own when the cabinet is shaken",
  "Keep heavy dishes and glass on the lowest shelves",
]
avoid = "In shaking, doors swing open and what's behind them falls out."
renter = "Adhesive latches leave nothing behind."
when = "quake"
source = "Tokyo Fire Department; Earthquake Country Alliance, Secure Your Space"

[recall]
label = "Check it isn't recalled"
icon = "search"
why = "Recalled pieces often come with a free anchoring kit or a refund."
buy = ""
