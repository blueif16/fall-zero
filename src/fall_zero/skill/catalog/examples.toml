# Worked examples: real-world pieces described the way the engine reads them. The model compares a
# photographed piece against these, picks the closest, and changes what the photo shows. Add one here
# to teach it a new kind of piece; no code changes.
#
# Every key except `label` and `mass_kg` is a Case field (furniture.py). `zones` stack from the floor
# up: kind = drawers | doors | open, share = its share of the inside height, rows/cols, shelves,
# hinge = side | bottom (doors), contents = a key of contents.toml, fill = the share it takes.
# `mass_kg` is the empty weight when it is known; the panels are scaled to match it. Units: metres.

