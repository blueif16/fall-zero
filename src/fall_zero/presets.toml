# Furniture presets: the library each photographed piece is matched to.
#
# Muse Spark picks the closest preset, then overrides only what it can see (width, height,
# drawer grid, items on top). Everything else, especially depth, which a photo rarely shows,
# comes from here. Every key except `label` is a Dresser field (see furniture.py); leave a key
# out to use the Dresser default. Units: metres.
#
# Tune these against real pieces: published dimensions, weighed pieces, and pull tests.

